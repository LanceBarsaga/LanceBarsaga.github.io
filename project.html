<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lance Ian Barsaga | Projects</title>
  
  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- BOOTSTRAP 5 & ICONS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --cyan-glow: #00ffe0;
      --cyan-bright: #00f2fe;
      --cyan-dark: #001f24;
      --card-bg: rgba(10, 20, 30, 0.75);
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    /* CUSTOM SCROLLBAR */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(8, 12, 20, 0.8);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--cyan-dark), var(--cyan-glow));
      border-radius: 5px;
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--cyan-glow);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #080c14;
      color: #e0f7fc;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* BACKGROUND IMAGE WITH OVERLAY */
    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(to bottom, rgba(8, 12, 20, 0.8), rgba(8, 12, 20, 0.95)), 
                  url('image/bgg.jpg') center/cover no-repeat fixed;
    }

    /* HEADER & NAVIGATION */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 2rem;
      background: rgba(8, 12, 20, 0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 255, 224, 0.2);
    }

    .avatar-box {
      display: flex;
      align-items: center;
    }

    .avatar-box img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--cyan-glow);
      box-shadow: 0 0 15px rgba(0, 255, 224, 0.6);
      object-fit: cover;
    }

    .navbar-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 0.5rem 1.3rem;
      background: var(--cyan-dark);
      color: var(--cyan-glow);
      border: 1px solid rgba(0, 255, 224, 0.4);
      border-radius: 25px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px rgba(0, 255, 224, 0.2);
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--cyan-glow);
      color: #041014;
      border-color: var(--cyan-glow);
      box-shadow: 0 0 18px var(--cyan-glow);
    }

    .close-btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      padding: 0.5rem 1.2rem;
      background: rgba(255, 50, 50, 0.15);
      color: #ff6b6b;
      border: 1px solid rgba(255, 50, 50, 0.4);
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .close-btn:hover {
      background: #ff4747;
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 71, 71, 0.6);
    }

    /* MAIN CONTAINER */
    .main-container {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ACTION BAR & CALENDAR CONTROLS */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .project-actions {
      display: flex;
      gap: 1rem;
    }

    .action-btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 0.6rem 1.4rem;
      background: var(--card-bg);
      color: var(--cyan-glow);
      border: 1px solid rgba(0, 255, 224, 0.4);
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }

    .action-btn:hover {
      background: var(--cyan-glow);
      color: #041014;
      box-shadow: 0 0 20px var(--cyan-glow);
      transform: translateY(-2px);
    }

    /* CALENDAR CLOCK WIDGET */
    .calendar-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 224, 0.3);
      border-radius: 12px;
      padding: 0.5rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }

    .calendar-card .date {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      color: #a8f4ff;
    }

    .calendar-card .clock {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--cyan-glow);
      text-shadow: 0 0 8px var(--cyan-glow);
    }

    /* PROJECTS PANEL */
    .projects-wrapper {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 224, 0.3);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 255, 224, 0.05);
      min-height: 400px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    /* PROJECT CARD ITEM */
    .project-card {
      background: rgba(4, 15, 24, 0.8);
      border: 1px solid rgba(0, 255, 224, 0.25);
      border-radius: 14px;
      padding: 1.2rem;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
    }

    .project-card:hover {
      border-color: var(--cyan-glow);
      transform: translateY(-6px);
      box-shadow: 0 0 20px rgba(0, 255, 224, 0.35);
      color: inherit;
    }

    .project-thumb-box {
      width: 100%;
      height: 130px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1rem;
      border: 1px solid rgba(0, 255, 224, 0.2);
      background: #020b10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .project-card:hover .project-thumb-box img {
      transform: scale(1.08);
    }

    .project-title {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--cyan-glow);
      margin: 0;
      letter-spacing: 1px;
    }

    /* FOOTER */
    .footer {
      margin-top: auto;
      padding: 0.4rem 1rem;
      background: rgba(6, 10, 18, 0.95);
      border-top: 1px solid rgba(0, 255, 224, 0.2);
      text-align: center;
    }

    .footer marquee {
      font-family: var(--font-heading);
      color: var(--cyan-glow);
      font-size: 0.75rem;
      letter-spacing: 1px;
      margin-bottom: 0.2rem;
      display: block;
    }

    .footer-subtext {
      font-size: 0.75rem;
      color: #92c5d6;
      margin: 0;
      line-height: 1.2;
    }

    .footer-subtext a {
      color: var(--cyan-bright);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .footer-subtext a:hover {
      color: var(--cyan-glow);
      text-decoration: underline;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .header-nav {
        flex-direction: column;
        gap: 1rem;
      }

      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .project-actions {
        justify-content: center;
      }

      .calendar-card {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND OVERLAY -->
  <div class="bg-wrapper"></div>

  <!-- NAVIGATION BAR -->
  <header class="header-nav">
    <div class="avatar-box">
      <img src="/Images/avatar.png" alt="Lance Ian Avatar" onerror="this.src='https://via.placeholder.com/50'">
    </div>

    <nav class="navbar-links">
      <a class="nav-btn" href="dashboard.html">HOME</a>
      <a class="nav-btn" href="about.html">ABOUT</a>
      <a class="nav-btn active" href="#project.html">PROJECT</a>
      <a class="nav-btn" href="contact.html">CONTACT</a>
    </nav>

    <a href="#" class="close-btn">
      <i class="bi bi-box-arrow-left me-1"></i> CLOSE
    </a>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- ACTION CONTROLS & WIDGET -->
    <div class="action-bar">
      <div class="project-actions">
        <button class="action-btn">
          <i class="bi bi-plus-circle-fill"></i> Add Project
        </button>
        <button class="action-btn">
          <i class="bi bi-pencil-square"></i> Edit Project
        </button>
      </div>

      <!-- DIGITAL CLOCK & DATE WIDGET -->
      <div class="calendar-card">
        <div class="date" id="currentDate">--</div>
        <div class="clock" id="clock">00:00:00 AM</div>
      </div>
    </div>

    <!-- PROJECTS DISPLAY CONTAINER -->
    <div class="projects-wrapper">
      <div class="projects-grid">

        <!-- CALCULATOR CARD -->
        <a href="/CALCULATOR.html" class="project-card">
          <div class="project-thumb-box">
            <img src="/Images/calculator.jpg" alt="Calculator" onerror="this.src='https://via.placeholder.com/200x120?text=Calculator'">
          </div>
          <h3 class="project-title">CALCULATOR</h3>
        </a>

        <!-- CLOCK CARD -->
        <a href="/CLOCK.HTML" class="project-card">
          <div class="project-thumb-box">
            <img src="/Images/clock.png" alt="Clock" onerror="this.src='https://via.placeholder.com/200x120?text=Clock'">
          </div>
          <h3 class="project-title">CLOCK</h3>
        </a>

        <!-- BULB CARD -->
        <a href="/BULB.html" class="project-card">
          <div class="project-thumb-box">
            <img src="/Images/bulb.png" alt="Bulb" onerror="this.src='https://via.placeholder.com/200x120?text=Bulb'">
          </div>
          <h3 class="project-title">BULB</h3>
        </a>

      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <marquee scrollamount="6">THANK YOU FOR VISITING MY PERSONAL WEBSITE. HAVE A NICE DAY!</marquee>
    <p class="footer-subtext">
      Looking to work with me or grab some coffee? Feel free to email me at:<br>
      <a href="mailto:barsagalanceian@gmail.com?subject=Hey!">barsagalanceian@gmail.com</a>
    </p>
  </footer>

  <!-- REAL-TIME CLOCK SCRIPT -->
  <script>
    function updateClock() {
      const now = new Date();
      const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);

      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12; 

      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
