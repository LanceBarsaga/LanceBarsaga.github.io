<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLOCK | Lance Ian Barsaga</title>
  
  <!-- GOOGLE FONTS & ICONS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --cyan-glow: #00ffe0;
      --cyan-bright: #00f2fe;
      --card-bg: rgba(10, 20, 30, 0.85);
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #080c14;
      color: #e0f7fc;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* BACKGROUND OVERLAY */
    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(to bottom, rgba(8, 12, 20, 0.85), rgba(8, 12, 20, 0.95)), 
                  url('/Images/bg.gif.gif') center/cover no-repeat fixed;
    }

    /* TOP BAR & BACK BUTTON */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .back-btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 0.6rem 1.4rem;
      background: var(--card-bg);
      color: var(--cyan-glow);
      border: 1px solid rgba(0, 255, 224, 0.4);
      border-radius: 25px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .back-btn:hover {
      background: var(--cyan-glow);
      color: #041014;
      box-shadow: 0 0 20px var(--cyan-glow);
      transform: translateY(-2px);
    }

    /* CLOCK CARD CONTAINER */
    .clock-container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 255, 224, 0.3);
      border-radius: 24px;
      padding: 3rem 4rem;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 255, 224, 0.05);
      position: relative;
      max-width: 90%;
      width: 650px;
    }

    /* HUD CORNER ACCENTS */
    .clock-container::before, .clock-container::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--cyan-glow);
    }

    .clock-container::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 24px;
    }

    .clock-container::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
      border-bottom-right-radius: 24px;
    }

    .clock-title {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #88c0d0;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    /* DIGITAL CLOCK DISPLAY */
    #clock {
      font-family: var(--font-heading);
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--cyan-glow);
      text-shadow: 0 0 20px var(--cyan-glow), 0 0 40px rgba(0, 255, 224, 0.4);
      letter-spacing: 3px;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    /* DATE DISPLAY */
    #date-display {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      color: var(--cyan-bright);
      letter-spacing: 2px;
      opacity: 0.85;
      margin-top: 0.5rem;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .clock-container {
        padding: 2rem 1.5rem;
      }

      #clock {
        font-size: 2.5rem;
      }

      #date-display {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      .top-bar {
        position: relative;
        top: 0;
        left: 0;
        margin-bottom: 2rem;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      #clock {
        font-size: 1.8rem;
        letter-spacing: 1px;
      }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND OVERLAY -->
  <div class="bg-wrapper"></div>

  <!-- TOP BAR / BACK BUTTON -->
  <div class="top-bar">
    <a href="project.html" class="back-btn">
      <i class="bi bi-arrow-left"></i> BACK TO PROJECTS
    </a>
  </div>

  <!-- DIGITAL CLOCK HUD CARD -->
  <div class="clock-container">
    <div class="clock-title"><i class="bi bi-clock-history me-2"></i> SYSTEM TIME</div>
    <div id="clock">00:00:00 AM</div>
    <div id="date-display">LOADING DATE...</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      // Time Logic
      let hh = now.getHours();
      let mm = now.getMinutes();
      let ss = now.getSeconds();
      let session = "AM";

      if (hh === 0) {
        hh = 12;
      } else if (hh >= 12) {
        if (hh > 12) hh -= 12;
        session = "PM";
      }

      hh = (hh < 10) ? "0" + hh : hh;
      mm = (mm < 10) ? "0" + mm : mm;
      ss = (ss < 10) ? "0" + ss : ss;

      document.getElementById("clock").innerText = `${hh}:${mm}:${ss} ${session}`;

      // Date Logic
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById("date-display").innerText = now.toLocaleDateString('en-US', options).toUpperCase();
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
