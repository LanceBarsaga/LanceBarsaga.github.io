<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALCULATOR | Lance Ian Barsaga</title>
  
  <!-- GOOGLE FONTS & ICONS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --cyan-glow: #00ffe0;
      --cyan-bright: #00f2fe;
      --cyan-dark: #001f24;
      --card-bg: rgba(10, 20, 30, 0.85);
      --btn-bg: rgba(6, 16, 26, 0.9);
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #080c14;
      color: #e0f7fc;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* BACKGROUND OVERLAY */
    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(to bottom, rgba(8, 12, 20, 0.85), rgba(8, 12, 20, 0.95)), 
                  url('/Images/wow.webp') center/cover no-repeat fixed;
    }

    /* BACK BUTTON & TOP BAR */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .back-btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 0.6rem 1.4rem;
      background: var(--card-bg);
      color: var(--cyan-glow);
      border: 1px solid rgba(0, 255, 224, 0.4);
      border-radius: 25px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .back-btn:hover {
      background: var(--cyan-glow);
      color: #041014;
      box-shadow: 0 0 20px var(--cyan-glow);
      transform: translateY(-2px);
    }

    /* MAIN CALCULATOR WRAPPER */
    .calculator-container {
      width: 100%;
      max-width: 380px;
      padding: 1.5rem;
      margin: 1rem;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 255, 224, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 255, 224, 0.05);
    }

    .calc-header {
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .calc-header h1 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      color: var(--cyan-glow);
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--cyan-glow);
      margin: 0;
    }

    /* DISPLAY SCREEN */
    .display-screen {
      width: 100%;
      height: 70px;
      background: rgba(2, 10, 16, 0.9);
      border: 1px solid rgba(0, 255, 224, 0.4);
      border-radius: 12px;
      color: var(--cyan-glow);
      font-family: var(--font-heading);
      font-size: 1.8rem;
      text-align: right;
      padding: 10px 15px;
      outline: none;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    /* KEYPAD GRID */
    .cal-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn-calc {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: #e0f7fc;
      background: var(--btn-bg);
      border: 1px solid rgba(0, 255, 224, 0.2);
      border-radius: 10px;
      padding: 1rem 0;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .btn-calc:hover {
      background: rgba(0, 255, 224, 0.15);
      border-color: var(--cyan-glow);
      color: var(--cyan-glow);
      box-shadow: 0 0 12px var(--cyan-glow);
      transform: translateY(-2px);
    }

    .btn-calc:active {
      transform: translateY(0);
      box-shadow: 0 0 5px var(--cyan-glow);
    }

    /* SPECIAL BUTTON STYLES */
    .btn-operator {
      color: var(--cyan-bright);
      border-color: rgba(0, 242, 254, 0.3);
    }

    .btn-clear {
      color: #ff6b6b;
      border-color: rgba(255, 107, 107, 0.3);
    }

    .btn-clear:hover {
      background: rgba(255, 107, 107, 0.2);
      border-color: #ff6b6b;
      color: #ff6b6b;
      box-shadow: 0 0 12px #ff6b6b;
    }

    .btnequal {
      grid-row: span 2;
      background: var(--cyan-glow);
      color: #041014;
      border-color: var(--cyan-glow);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .btnequal:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 20px #fff;
    }

    .btnzero {
      grid-column: span 2;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 480px) {
      .calculator-container {
        max-width: 90%;
        padding: 1.2rem;
      }

      .top-bar {
        position: relative;
        top: 0;
        left: 0;
        margin-bottom: 1rem;
        width: 100%;
        display: flex;
        justify-content: flex-start;
        padding-left: 5%;
      }

      .btn-calc {
        font-size: 1rem;
        padding: 0.8rem 0;
      }

      .display-screen {
        font-size: 1.5rem;
        height: 60px;
      }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND OVERLAY -->
  <div class="bg-wrapper"></div>

  <!-- BACK BUTTON -->
  <div class="top-bar">
    <a href="project.html" class="back-btn">
      <i class="bi bi-arrow-left"></i> BACK TO PROJECTS
    </a>
  </div>

  <!-- CALCULATOR BOX -->
  <div class="calculator-container">
    <div class="calc-header">
      <h1>CALCULATOR</h1>
    </div>

    <form name="form1" submit="return false;">
      <input type="text" class="display-screen" name="textview" readonly placeholder="0">
    </form>

    <div class="cal-buttons">
      <button type="button" class="btn-calc btn-clear" onclick="clearDisplay()">C</button>
      <button type="button" class="btn-calc btn-operator" onclick="backspace()"><i class="bi bi-backspace"></i></button>
      <button type="button" class="btn-calc btn-operator" onclick="insert('/')">/</button>
      <button type="button" class="btn-calc btn-operator" onclick="insert('*')">*</button>

      <button type="button" class="btn-calc" onclick="insert('7')">7</button>
      <button type="button" class="btn-calc" onclick="insert('8')">8</button>
      <button type="button" class="btn-calc" onclick="insert('9')">9</button>
      <button type="button" class="btn-calc btn-operator" onclick="insert('-')">-</button>

      <button type="button" class="btn-calc" onclick="insert('4')">4</button>
      <button type="button" class="btn-calc" onclick="insert('5')">5</button>
      <button type="button" class="btn-calc" onclick="insert('6')">6</button>
      <button type="button" class="btn-calc btn-operator" onclick="insert('+')">+</button>

      <button type="button" class="btn-calc" onclick="insert('1')">1</button>
      <button type="button" class="btn-calc" onclick="insert('2')">2</button>
      <button type="button" class="btn-calc" onclick="insert('3')">3</button>
      <button type="button" class="btn-calc btnequal" onclick="equal()">=</button>

      <button type="button" class="btn-calc btnzero" onclick="insert('0')">0</button>
      <button type="button" class="btn-calc" onclick="insert('.')">.</button>
    </div>
  </div>

  <script>
    function insert(num) {
      const field = document.form1.textview;
      field.value = field.value + num;
    }

    function clearDisplay() {
      document.form1.textview.value = "";
    }

    function backspace() {
      let total = document.form1.textview.value;
      document.form1.textview.value = total.slice(0, -1);
    }

    function equal() {
      let total = document.form1.textview.value;
      if (total) {
        try {
          // Ligtas na pag-evaluate ng basic math expression
          document.form1.textview.value = Function('"use strict";return (' + total + ')')();
        } catch (e) {
          document.form1.textview.value = "Error";
          setTimeout(clearDisplay, 1500);
        }
      }
    }
  </script>
</body>
</html>
