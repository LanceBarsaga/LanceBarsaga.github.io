<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIGHT CONTROLLER | Lance Ian Barsaga</title>
  
  <!-- GOOGLE FONTS & ICONS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --cyan-glow: #00ffe0;
      --cyan-bright: #00f2fe;
      --card-bg: rgba(10, 20, 30, 0.85);
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #080c14;
      color: #e0f7fc;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* BACKGROUND OVERLAY */
    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at center, rgba(10, 25, 40, 0.9), rgba(4, 8, 14, 0.98));
      transition: background 0.5s ease;
    }

    body.light-active .bg-wrapper {
      background: radial-gradient(circle at center, rgba(0, 255, 224, 0.15), rgba(4, 8, 14, 0.98));
    }

    /* TOP BAR & BACK BUTTON */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .back-btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 0.6rem 1.4rem;
      background: var(--card-bg);
      color: var(--cyan-glow);
      border: 1px solid rgba(0, 255, 224, 0.4);
      border-radius: 25px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .back-btn:hover {
      background: var(--cyan-glow);
      color: #041014;
      box-shadow: 0 0 20px var(--cyan-glow);
      transform: translateY(-2px);
    }

    /* CONTROL PANEL CONTAINER */
    .panel-container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 255, 224, 0.3);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 255, 224, 0.05);
      position: relative;
      max-width: 90%;
      width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HUD CORNER ACCENTS */
    .panel-container::before, .panel-container::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--cyan-glow);
    }

    .panel-container::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 24px;
    }

    .panel-container::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
      border-bottom-right-radius: 24px;
    }

    .panel-title {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: var(--cyan-bright);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--cyan-glow);
    }

    /* BULB IMAGE CONTAINER (RECTANGLE & LARGER) */
    .bulb-box {
      width: 100%;
      max-width: 380px;
      height: 240px;
      border-radius: 16px;
      background: rgba(2, 10, 16, 0.8);
      border: 2px solid rgba(0, 255, 224, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.8rem;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      padding: 6px;
    }

    .bulb-box:hover {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 25px rgba(0, 255, 224, 0.4), inset 0 0 15px rgba(0, 255, 224, 0.2);
      transform: scale(1.02);
    }

    .bulb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
      transition: all 0.3s ease;
    }

    body.light-active .bulb-box {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 35px var(--cyan-glow), inset 0 0 25px rgba(0, 255, 224, 0.3);
    }

    body.light-active .bulb-box img {
      filter: drop-shadow(0 0 15px var(--cyan-glow));
    }

    /* TOGGLE BUTTON & STATUS */
    .status-badge {
      font-family: var(--font-heading);
      font-size: 0.9rem;
      letter-spacing: 2px;
      padding: 0.5rem 1.4rem;
      border-radius: 20px;
      background: rgba(0, 255, 224, 0.15);
      color: var(--cyan-glow);
      border: 1px solid var(--cyan-glow);
      box-shadow: 0 0 12px rgba(0, 255, 224, 0.4);
      margin-bottom: 1rem;
      transition: all 0.3s ease;
    }

    .instruction-text {
      font-size: 0.85rem;
      color: #88c0d0;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .top-bar {
        position: relative;
        top: 0;
        left: 0;
        margin-bottom: 1.5rem;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .panel-container {
        padding: 1.8rem 1.2rem;
      }

      .bulb-box {
        height: 200px;
      }
    }
  </style>
</head>
<body class="light-active">

  <!-- BACKGROUND OVERLAY -->
  <div class="bg-wrapper"></div>

  <!-- TOP BAR / BACK BUTTON -->
  <div class="top-bar">
    <a href="project.html" class="back-btn">
      <i class="bi bi-arrow-left"></i> BACK TO PROJECTS
    </a>
  </div>

  <!-- CONTROL PANEL HUD -->
  <div class="panel-container">
    <div class="panel-title"><i class="bi bi-power me-2"></i> LIGHT CONTROL</div>
    
    <!-- RECTANGULAR BULB CONTAINER -->
    <div class="bulb-box" onclick="light_change()">
      <img id="personal" src="/Images/bulb_on.webp" alt="Bulb State">
    </div>

    <!-- STATUS BADGE -->
    <div class="status-badge" id="statusBadge">STATE: POWER ON</div>

    <p class="instruction-text"><i class="bi bi-hand-index-thumb me-1"></i> CLICK THE BULB TO TOGGLE LIGHT</p>
  </div>

  <script>
    function light_change() {
      let image = document.getElementById('personal');
      let statusBadge = document.getElementById('statusBadge');
      let body = document.body;

      if (image.src.match("bulb_off")) {
        image.src = "/Images/bulb_on.webp";
        statusBadge.innerText = "STATE: POWER ON";
        body.classList.add("light-active");
      } else {
        image.src = "/Images/bulb_off.jpg";
        statusBadge.innerText = "STATE: POWER OFF";
        body.classList.remove("light-active");
      }
    }
  </script>
</body>
</html>
